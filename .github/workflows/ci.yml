name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  python:
    name: Python lint, unit + chart smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: pip install -r ../requirements.txt
      - name: Compile
        run: python -m py_compile partition_utils.py run_analysis.py
      - name: Unit test partition predicate
        run: python -m unittest tests.test_partition_predicate
      - name: Chart render smoke test (synthetic, no AWS needed)
        run: python tests/test_chart_smoke.py
        env:
          CI: "1"

  # Real data analysis is opt-in: only on manual dispatch, and only if AWS
  # creds are configured (checked at the STEP level, where `secrets` is legal —
  # the `secrets` context is NOT available in a job-level `if`, which is why
  # this is a step gate and not a job gate).
  analysis:
    name: Real analysis (against your AWS/Athena)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: pip install -r ../requirements.txt
      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Run analysis
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: >
          python run_analysis.py
          --busy-region ${{ vars.BUSY_REGION || 'us-east-1' }}
          --quiet-region ${{ vars.QUIET_REGION || 'eu-west-2' }}
          --baseline-start ${{ vars.BASELINE_START }}
          --baseline-end ${{ vars.BASELINE_END }}
          --heartbeat-start ${{ vars.HEARTBEAT_START }}
          --heartbeat-end ${{ vars.HEARTBEAT_END }}
          --out delay_comparison.png
      - name: Upload chart
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: delay-comparison
          path: analysis/delay_comparison.png
