name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger runs the real-data analysis. It prompts for the experiment
  # windows; regions default to the repo's expectations.
  workflow_dispatch:
    inputs:
      busy_region:
        description: "Busy (control) region"
        required: true
        default: "us-east-1"
      quiet_region:
        description: "Quiet region (noise injection target)"
        required: true
        default: "eu-west-2"
      baseline_start:
        description: "Baseline window start (noise OFF) — YYYY/MM/dd"
        required: true
      baseline_end:
        description: "Baseline window end (noise OFF) — YYYY/MM/dd"
        required: true
      heartbeat_start:
        description: "Heartbeat window start (noise ON) — YYYY/MM/dd"
        required: true
      heartbeat_end:
        description: "Heartbeat window end (noise ON) — YYYY/MM/dd"
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  workflow-lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar xzf /tmp/actionlint.tar.gz -C /tmp
          /tmp/actionlint --version
      - name: Lint
        run: find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 /tmp/actionlint

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  python:
    name: Python lint, unit + chart smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: pip install -r ../requirements.txt
      - name: Compile
        run: python -m py_compile partition_utils.py run_analysis.py
      - name: Unit test partition predicate
        run: python -m unittest tests.test_partition_predicate
      - name: Chart render smoke test (synthetic, no AWS needed)
        run: python tests/test_chart_smoke.py
        env:
          CI: "1"

  # Real-data analysis. Runs only on manual dispatch (so pushes/PRs stay
  # green without credentials). The experiment windows are required inputs
  # prompted in the Actions UI. The credential check is hoisted into a job env
  # var (the `secrets` context is NOT legal inside `if:`), and we fail loudly
  # if creds are missing rather than silently skipping.
  analysis:
    name: Real analysis (against your AWS/Athena)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_AWS_CREDS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      PYTHON_VERSION: "3.12"
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r ../requirements.txt
      - name: Require AWS credentials
        if: env.HAS_AWS_CREDS != 'true'
        run: |
          echo "::error::AWS credentials are not configured."
          echo "Add repo secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_REGION"
          echo "(Settings > Secrets and variables > Actions), then re-run this workflow."
          exit 1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.busy_region }}
      - name: Run analysis
        run: >
          python run_analysis.py
          --busy-region ${{ inputs.busy_region }}
          --quiet-region ${{ inputs.quiet_region }}
          --baseline-start ${{ inputs.baseline_start }}
          --baseline-end ${{ inputs.baseline_end }}
          --heartbeat-start ${{ inputs.heartbeat_start }}
          --heartbeat-end ${{ inputs.heartbeat_end }}
          --out delay_comparison.png
      - name: Upload chart
        uses: actions/upload-artifact@v4
        with:
          name: delay-comparison
          path: analysis/delay_comparison.png
